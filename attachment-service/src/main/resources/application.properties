server.port=8084

spring.application.name=attachment-service

# Database configuration with environment variable fallbacks
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/attachment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Ticket Service location for Feign client
ticket-service.url=http://${TICKET_SERVICE_HOST:localhost}:${TICKET_SERVICE_PORT:8082}

# S3 configuration
attachment.bucket=${ATTACHMENT_BUCKET:tkt-attachments}
aws.region=${AWS_REGION:ap-south-1}
