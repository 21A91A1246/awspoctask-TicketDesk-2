server.port=8083

spring.application.name=comment-service

# Database configuration with environment variable fallbacks
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/comment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# User Service & Ticket Service locations for Feign clients
user-service.url=http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8085}
ticket-service.url=http://${TICKET_SERVICE_HOST:localhost}:${TICKET_SERVICE_PORT:8082}
